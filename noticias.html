<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noticias del sector · Laura Muñoz Socorro</title>
<meta name="description" content="Agregador de noticias del sector agrícola: cítricos, frutales, PAC, fitosanitarios, riego y mercados.">
<link rel="stylesheet" href="./css/fuentes.css">
<link rel="stylesheet" href="./css/colors_and_type.css">
<link rel="stylesheet" href="./css/noticias.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#F7F7F5;color:#1A1A1A;font-family:'Open Sans',system-ui,sans-serif}
a{color:#147A59}a:hover{color:#1FA67A}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.top{background:#fff;border-bottom:1px solid #EFEFEF}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:14px;padding-bottom:14px}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:#1A1A1A}
.marca img{height:56px;width:auto}
.marca .pipe{width:1px;height:36px;background:#1FA67A}
.marca b{display:block;font-family:Montserrat,sans-serif;font-weight:800;font-size:13px;text-transform:uppercase}
.marca span span{font-size:11px;color:#147A59}
.volver{font-family:Montserrat,sans-serif;font-weight:600;font-size:13px;text-decoration:none}
.menu{display:flex;gap:28px;font-family:Montserrat,sans-serif;font-size:14px;font-weight:600}
.menu a{color:#1A1A1A;text-decoration:none;padding:6px 0;border-bottom:2px solid transparent;white-space:nowrap}
.menu a:hover,.menu a[aria-current]{border-bottom-color:#1FA67A}
@media (max-width:900px){.menu{gap:16px;font-size:13px}.volver{display:none}}
@media (max-width:640px){.top .wrap{flex-wrap:wrap}.menu{width:100%;justify-content:space-between}}
main{padding:64px 0 80px}
.eyebrow{font-family:Montserrat,sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#147A59;font-weight:700}
.h2{font-family:Montserrat,sans-serif;font-weight:800;font-size:clamp(28px,3.4vw,42px);text-transform:uppercase;line-height:1.05;margin:10px 0 14px}
@media (max-width:640px){.wrap{padding:0 18px}.marca span{display:none}}
.nt-tools{justify-content:center!important}
.nt-ftog{display:inline-flex;align-items:center;gap:8px;font-family:Montserrat,sans-serif;font-weight:600;font-size:14px;padding:10px 18px;border:1px solid #D9D9D9;border-radius:999px;background:#fff;color:#1A1A1A;cursor:pointer;transition:border-color .2s}
.nt-ftog:hover,.nt-ftog[aria-expanded="true"]{border-color:#1FA67A;color:#147A59}
.nt-ftog.activo{background:#147A59;border-color:#147A59;color:#fff}
.nt-fcar{transition:transform .2s}.nt-ftog[aria-expanded="true"] .nt-fcar{transform:rotate(180deg)}
.nt-fpanel{margin:-12px 0 26px}
.nt-fpanel .nt-filtros{display:flex!important;flex-wrap:wrap!important;justify-content:center;gap:8px;overflow:visible!important;width:auto!important;margin:0!important;padding:0!important}
.to-top{position:fixed;right:22px;bottom:22px;width:48px;height:48px;border-radius:50%;border:0;background:#1FA67A;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.18);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(10px);transition:opacity .25s,transform .25s,background .2s;z-index:50}
.to-top.vis{opacity:1;pointer-events:auto;transform:none}.to-top:hover{background:#147A59}
@media (max-width:640px){.nt-ftog{flex:1 1 100%;justify-content:center}.to-top{right:14px;bottom:14px;width:44px;height:44px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="marca" href="./index.html"><img src="./img/logo-isotipo-recorte.png" alt="Laura Muñoz Socorro"><i class="pipe"></i><span><b>Laura Muñoz Socorro</b><span>Ingeniera Técnica Agrícola</span></span></a>
  <nav class="menu" aria-label="Menú principal"><a href="./index.html#servicios">Servicios</a><a href="./noticias.html" aria-current="page">Noticias</a><a href="./index.html#sobre">Sobre mí</a><a href="./index.html#contacto">Contacto</a></nav>
  <a class="volver" href="./index.html">← Volver a la web</a>
</div></header>

<main>
<section class="noticias" id="noticias" aria-labelledby="noticias-titulo" data-json="./data/noticias.json" data-img-default="./img/noticia-default.jpg"><div class="wrap">
  <div class="nt-top"><div><div class="eyebrow">Actualidad</div><h1 class="h2" id="noticias-titulo">Noticias del sector</h1></div><p class="nt-upd" id="nt-upd" aria-live="polite">Última actualización: —</p></div>
  <div class="nt-tools"><button type="button" class="nt-ftog" id="nt-ftog" aria-expanded="false" aria-controls="nt-fpanel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span id="nt-flbl">Filtrar por tema</span><span class="nt-fcar" aria-hidden="true">▾</span></button><label class="nt-buscar"><span class="sr">Buscar en las noticias</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" id="nt-q" placeholder="Buscar por palabra clave…" autocomplete="off"></label></div>
  <div class="nt-fpanel" id="nt-fpanel" hidden><div class="nt-filtros" id="nt-filtros" role="group" aria-label="Filtrar noticias por categoría"></div></div>
  <p class="nt-estado" id="nt-estado" role="status" hidden></p>
  <div class="nt-grid" id="nt-grid"></div>
  <div class="nt-mas-wrap"><button type="button" class="nt-mas" id="nt-mas" hidden>Cargar más</button></div>
  <p class="nt-aviso">Las noticias pertenecen a sus respectivos medios. Aquí solo se muestra un extracto con enlace a la fuente original.</p>
</div></section>
</main>

<button class="to-top" id="to-top" type="button" aria-label="Volver arriba"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
<script src="./js/noticias.js" defer></script>
<script>
(function(){
  var tog=document.getElementById('nt-ftog'),pan=document.getElementById('nt-fpanel'),lbl=document.getElementById('nt-flbl'),fil=document.getElementById('nt-filtros');
  tog.addEventListener('click',function(){var o=pan.hidden;pan.hidden=!o;tog.setAttribute('aria-expanded',o);});
  fil.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=b.textContent.trim();
    setTimeout(function(){pan.hidden=true;tog.setAttribute('aria-expanded','false');lbl.textContent=(t==='Todas')?'Filtrar por tema':'Tema: '+t;tog.classList.toggle('activo',t!=='Todas');},120);});
  var up=document.getElementById('to-top');
  addEventListener('scroll',function(){up.classList.toggle('vis',scrollY>600);},{passive:true});
  up.addEventListener('click',function(){scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
})();
</script>
</body>
</html>
